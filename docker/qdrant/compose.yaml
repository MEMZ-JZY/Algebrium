services:
  qdrant:
    image: qdrant/qdrant:latest
    container_name: algebrium-qdrant
    restart: unless-stopped
    ports:
      # 7333 sits inside a common Windows/Hyper-V reserved port range; 17333 does not.
      - "127.0.0.1:17333:6333"
    volumes:
      - ../../data/qdrant:/qdrant/storage
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 1G
